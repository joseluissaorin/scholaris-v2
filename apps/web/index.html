<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scholaris</title>
    <meta name="description" content="Tu biblioteca, leída y citable. Cualquier archivo se vuelve buscable y cada cita apunta a la página impresa o al segundo exacto." />
    <meta name="theme-color" content="#F3EEE3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1612" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/monograma.svg" type="image/svg+xml" />
    <script>
      // Tema antes del primer pintado: sin parpadeo ni salto.
      (function () {
        try {
          var t = localStorage.getItem('scholaris.tema') || 'sistema';
          var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('oscuro');
          var d = localStorage.getItem('scholaris.densidad');
          if (d && d !== 'normal') document.documentElement.dataset.densidad = d;
          var l = localStorage.getItem('scholaris.lectura');
          if (l) document.documentElement.style.setProperty('--tam-lectura', Number(l) / 16 + 'rem');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Primer pintado sin JavaScript: el papel y el riel con el monograma, en su sitio definitivo. React lo sustituye. -->
    <div id="raiz"><div style="display:flex;min-height:100dvh;font-family:Georgia,serif"><div class="pre-riel" style="width:5.5rem;border-right:1px solid var(--s-filete);display:flex;justify-content:center;padding-top:1.25rem"><svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><rect width="40" height="40" fill="var(--s-tinta)"/><path d="M40 22v18H22A18 18 0 0140 22z" fill="var(--s-rojo)"/><text x="17" y="29" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="27" fill="var(--s-papel)">S</text></svg></div></div></div>
    <style>@media (max-width:767px){.pre-riel{display:none!important}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
