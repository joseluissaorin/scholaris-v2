<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <script>
      // La portada (src/portada): quien llega a «/» sin sesión de Clerk ve /acerca (o /en), que es HTML
      // estático y no carga ni la aplicación ni Clerk. «/?entrar» y «/?demostracion» entran siempre; la
      // versión local (localhost, red de casa, Tailscale) va directa a la Biblioteca.
      (function () {
        try {
          var l = location, c = document.cookie;
          if (l.pathname !== '/' || l.search || l.hash) return;
          if (/^(localhost|127\.|\[::1\]|10\.|192\.168\.|100\.)|\.(local|ts\.net)$/.test(l.hostname)) return;
          if (/(?:^|;\s*)__session(?:_[^=]*)?=/.test(c) || /(?:^|;\s*)__client_uat(?:_[^=]*)?=(?!0(?:;|$))/.test(c)) return;
          if (sessionStorage.getItem('scholaris.demostracion') === '1') return;
          l.replace(/^es\b/i.test(navigator.language || 'es') ? '/acerca' : '/en');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scholaris</title>
    <meta name="description" content="Tu biblioteca, leída y citable. Cualquier archivo se vuelve buscable y cada cita apunta a la página impresa o al segundo exacto." />
    <meta name="theme-color" content="#2C1810" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140D09" media="(prefers-color-scheme: dark)" />
    <link rel="preload" href="/fuentes/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Scholaris" />
    <meta property="og:description" content="Has leído los libros. Scholaris recuerda las páginas." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Tema antes del primer pintado: sin parpadeo ni salto.
      (function () {
        try {
          var t = localStorage.getItem('scholaris.tema') || 'sistema';
          var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('oscuro');
          var d = localStorage.getItem('scholaris.densidad');
          if (d && d !== 'normal') document.documentElement.dataset.densidad = d;
          var l = localStorage.getItem('scholaris.lectura');
          if (l) document.documentElement.style.setProperty('--tam-lectura', Number(l) / 16 + 'rem');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Primer pintado sin JavaScript: la barra café con el logo, en su sitio definitivo. React lo sustituye. -->
    <div id="raiz"><div style="display:flex;min-height:100dvh"><div class="pre-barra" style="width:14rem;background:#2c1810"><div style="height:3.5rem;display:flex;align-items:center;gap:.625rem;padding:0 1.25rem;border-bottom:1px solid #4a2e1a"><img src="/logo.webp" width="32" height="32" alt="" style="filter:invert(1) sepia(.2) brightness(.95);mix-blend-mode:lighten" /><span style="font:600 1.125rem system-ui,sans-serif;letter-spacing:.025em;color:#faf7f0">Scholaris</span></div></div></div></div>
    <style>@media (max-width:1023px){.pre-barra{display:none!important}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
