[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholaris-sdk"
version = "2.0.0"
authors = [
    {name = "José Luis Saorín Ferrer", email = "jl@joseluissaorin.com"},
]
description = "Cliente de Python para Scholaris: API de citas con página verificada y lector de SPDF 4.0 sin conexión"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["scholaris", "citas", "citations", "spdf", "bibliografía", "rag", "academic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
vectores = ["numpy>=1.24.0"]
v1 = [
    "python-dotenv>=1.0.0",
    "pdf2bib>=1.2",
    "bibtexparser>=1.4.0",
    "PyPaperBot>=1.2.0",
    "google-generativeai>=0.3.0",
    "google-api-python-client>=2.0.0",
    "python-docx>=0.8.11",
    "markdown>=3.4.0",
    "beautifulsoup4>=4.11.0",
    "PyMuPDF>=1.23.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]
dev = [
    "pytest>=7.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
scholaris = "scholaris.cli:main"

[project.urls]
Homepage = "https://scholaris.joseluissaorin.com"
Documentation = "https://scholaris.joseluissaorin.com/api"
Source = "https://github.com/joseluissaorin/scholaris-v2"
Issues = "https://github.com/joseluissaorin/scholaris-v2/issues"

# Solo se publica el paquete `scholaris`. `spdf/` (referencia de los formatos
# SPDF 1.0 a 3.0) se queda en el repositorio: su nombre ya existe en PyPI.
[tool.setuptools.packages.find]
include = ["scholaris", "scholaris.*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
