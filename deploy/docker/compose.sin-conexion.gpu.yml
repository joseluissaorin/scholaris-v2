# GPU NVIDIA para el modo sin conexión (encima de compose.yml y compose.sin-conexion.yml):
#   docker compose -f deploy/docker/compose.yml -f deploy/docker/compose.sin-conexion.yml \
#                  -f deploy/docker/compose.sin-conexion.gpu.yml up -d
#
# Con 12 GB de VRAM caben a la vez Qwen2.5-VL 7B (Q4, ~6 GB), EmbeddingGemma 2
# (~3 GB en bfloat16 con todos los codificadores) y whisper large-v3-turbo (~1,6 GB).
# Con más VRAM, INFERENCIA_MODELO_LECTOR=qwen3-vl:8b-instruct (más fiel, algo más lento).
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    <<: *gpu

  embeddinggemma:
    <<: *gpu
    build:
      context: ../inferencia/embeddinggemma2
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu128
    image: scholaris-embeddinggemma2:cuda

  whisper:
    <<: *gpu
    image: ghcr.io/ggml-org/whisper.cpp:${WHISPER_IMAGEN:-main-cuda}
