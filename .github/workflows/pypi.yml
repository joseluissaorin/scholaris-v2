# Publica el SDK de Python (sdk/python) en PyPI como «scholaris-sdk».
# Se lanza al empujar una etiqueta sdk-vX.Y.Z; la versión de pyproject.toml
# tiene que coincidir con la etiqueta. Usa Trusted Publishing: sin tokens.
name: PyPI

on:
  push:
    tags:
      - "sdk-v*"

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar que la etiqueta coincide con la versión
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "sdk-v${version}" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con la versión ${version}"; exit 1; }
      - name: Pruebas sin red
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests
      - name: Construir sdist y wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scholaris-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
