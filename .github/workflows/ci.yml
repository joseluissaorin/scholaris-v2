# Integración continua: tipos, pruebas de todos los paquetes y apps, compilación
# de la web y pruebas del SDK de Python. No necesita ningún secreto: las pruebas
# usan proveedores falsos y no llaman a ninguna API de pago.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Tipos, pruebas y web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: Dependencias
        run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm -r typecheck
      - name: Pruebas
        run: pnpm -r --workspace-concurrency=1 test
      - name: Web
        run: pnpm --filter @scholaris/web build

  python:
    name: SDK de Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas sin red
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q tests
